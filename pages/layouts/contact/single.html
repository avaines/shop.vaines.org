{{ define "main" }}
<section class="container contact-page">
  <div class="contact-layout">
    <article class="contact-intro">
      <h1>{{ .Title }}</h1>
      <div class="contact-copy">
        {{ .Content }}
      </div>
    </article>

    <aside class="contact-panel">
      <h2>{{ .Site.Params.contact.heading | default "Send a message" }}</h2>
      <p class="contact-note">{{ .Site.Params.contact.note | default "Use this form for product questions or custom requests." }}</p>

      <form
        action="{{ .Site.Params.contact.formAction }}"
        method="POST"
        class="contact-form"
      >
        <label for="contact-name">Name</label>
        <input id="contact-name" name="name" type="text" autocomplete="name" required>

        <label for="contact-email">Email</label>
        <input id="contact-email" name="email" type="email" autocomplete="email" required>

        <label for="contact-message">Message</label>
        <textarea id="contact-message" name="message" rows="6" required></textarea>

        <button class="contact-submit" type="submit">Send message</button>
      </form>
    </aside>
  </div>
</section>
{{ end }}
