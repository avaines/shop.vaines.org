<!DOCTYPE html>
<html lang="en-gb">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ if .IsHome }}{{ .Site.Title }} - {{ .Site.Params.subHeader }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}</title>
  {{ $font := .Site.Params.font | default "system-ui" }}
  {{ if ne $font "system-ui" }}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family={{ replace $font " " "+" }}:wght@400;700&display=swap" rel="stylesheet">
  {{ end }}
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="/css/main.css">
  <style>
    :root {
      --font-family: {{ if ne $font "system-ui" }}'{{ $font }}', {{ end }}system-ui, -apple-system, sans-serif;
    }
  </style>
</head>
<body>
  {{ partial "header.html" . }}

  <main id="main-content">
    {{ block "main" . }}{{ end }}
  </main>

  {{ partial "footer.html" . }}
</body>
</html>
