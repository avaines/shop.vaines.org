{{ define "main" }}
<section class="container">
  <h1 id="category-heading" class="category-heading">Product Category</h1>
  <div id="products" class="product-grid">

</section>

<script>

</script>
<script type="module" src="/js/category-page.js"></script>
{{ end }}
