name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Install Hugo
      uses: peaceiris/actions-hugo@v3
      with:
        hugo-version: '0.143.1'
        extended: true

    - name: Run linters
      run: npm run lint

    - name: Run tests
      run: npm test

    - name: Build Pages (Hugo)
      run: npm run build:pages

    - name: Validate Worker
      run: npm run build:worker
