<body>
  <header class="site-header">
  <div class="site-header__inner">
    <a href="/" class="site-title">Vaines Shop</a>

    <nav aria-label="Primary navigation">
      <ul class="site-nav">
        <li><a href="/">Home</a></li>
        <li><a href="/about/">About</a></li>
        <li><a href="/contact/">Contact</a></li>
      </ul>
    </nav>

    <div id="category-nav" aria-label="Product categories"></div>
  </div>
</header>


  <main id="main-content">
    
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    line-height: 1.6;
    color: #333;
    background: #f5f5f5;
  }

  .container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 20px;
  }

  .product-card {
    background: white;
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    transition: transform 0.2s, box-shadow 0.2s;
  }

  .product-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
  }

  .product-image {
    width: 100%;
    height: 280px;
    object-fit: cover;
  }

  .product-info {
    padding: 16px;
  }

  .product-name {
    font-size: 18px;
    font-weight: 600;
    margin-bottom: 8px;
  }

  .product-description {
    font-size: 14px;
    color: #666;
    margin-bottom: 12px;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .product-categories {
    font-size: 12px;
    color: #999;
    margin-bottom: 12px;
  }

  .product-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .availability {
    font-size: 13px;
    padding: 4px 8px;
    border-radius: 4px;
  }

  .availability.in-stock {
    background: #e7f5e8;
    color: #2e7d32;
  }

  .availability.sold-out {
    background: #fce4e4;
    color: #c62828;
  }

  .etsy-link {
    color: #f16521;
    text-decoration: none;
    font-weight: 600;
    font-size: 14px;
  }

  .etsy-link:hover {
    text-decoration: underline;
  }

  .loading {
    text-align: center;
    padding: 60px 20px;
    color: #999;
  }

  .error {
    text-align: center;
    padding: 60px 20px;
    color: #c62828;
    background: #fce4e4;
    border-radius: 8px;
  }

</style>

<section class="container">
  <div id="products" class="product-grid">
    <div class="loading">Loading products...</div>
  </div>
</section>

<script type="module" src="/js/products.js"></script>
