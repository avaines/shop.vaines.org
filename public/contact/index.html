<!DOCTYPE html>
<html lang="en-gb">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Vaines Shop</title>
  <link rel="stylesheet" href="/css/main.css">
</head>
<body>
  <header class="site-header">
  <div class="site-header__inner">
    <a href="/" class="site-title">Vaines Shop</a>

    <nav aria-label="Primary navigation">
      <ul class="site-nav">
        <li><a href="/">Home</a></li>
        <li><a href="/about/">About</a></li>
        <li><a href="/contact/">Contact</a></li>
      </ul>
    </nav>

    <div id="category-nav" aria-label="Product categories"></div>
  </div>
</header>


  <main id="main-content">
    
<section class="container content-page">
  <article>
    <h1>Contact</h1>
    <p>Have a question about a product or custom order?</p>
<p>Use the form below and we will get back to you soon.</p>


    <form
      action="https://formspree.io/f/your-form-id"
      method="POST"
      class="contact-form"
    >
      <label for="contact-name">Name</label>
      <input id="contact-name" name="name" type="text" required>

      <label for="contact-email">Email</label>
      <input id="contact-email" name="email" type="email" required>

      <label for="contact-message">Message</label>
      <textarea id="contact-message" name="message" rows="6" required></textarea>

      <button type="submit">Send message</button>
    </form>
  </article>
</section>

  </main>

  <footer class="site-footer">
  <div class="site-footer__inner">
    <p>&copy; 2026 Vaines Shop. All rights reserved.</p>

    <nav aria-label="Footer links">
      <ul class="footer-links">
        <li><a href="/privacy/">Privacy</a></li>
        <li><a href="https://instagram.com/" rel="noopener noreferrer" target="_blank">Instagram</a></li>
        <li><a href="https://facebook.com/" rel="noopener noreferrer" target="_blank">Facebook</a></li>
      </ul>
    </nav>
  </div>
</footer>

</body>
</html>
